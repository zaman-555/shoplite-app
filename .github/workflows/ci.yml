name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the catalog API
        working-directory: services/catalog-api
        run: |
          pip install -r requirements-dev.txt
          pytest -q
      - name: Test the order worker
        working-directory: services/order-worker
        run: |
          pip install -r requirements-dev.txt
          pytest -q

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          if [ -n "${ECR_REGISTRY}" ] && [ -n "${AWS_ROLE_ARN}" ]; then
            echo "style=ecr" >> "$GITHUB_OUTPUT"
            echo "registry=${ECR_REGISTRY}" >> "$GITHUB_OUTPUT"
          else
            echo "style=ghcr" >> "$GITHUB_OUTPUT"
            echo "registry=ghcr.io/${owner}" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish web to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/shoplite-web:${{ steps.names.outputs.tag }}
            ghcr.io/${{ steps.names.outputs.owner }}/shoplite-web:latest
      - name: Publish catalog-api to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/catalog-api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/shoplite-catalog-api:${{ steps.names.outputs.tag }}
            ghcr.io/${{ steps.names.outputs.owner }}/shoplite-catalog-api:latest
      - name: Publish order-worker to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/order-worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/shoplite-order-worker:${{ steps.names.outputs.tag }}
            ghcr.io/${{ steps.names.outputs.owner }}/shoplite-order-worker:latest
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.names.outputs.style == 'ecr'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}
      - uses: aws-actions/amazon-ecr-login@v2
        if: steps.names.outputs.style == 'ecr'
      - name: Publish the same images to ECR
        if: steps.names.outputs.style == 'ecr'
        env:
          REGISTRY: ${{ steps.names.outputs.registry }}
          TAG: ${{ steps.names.outputs.tag }}
        run: |
          docker build -f services/web/Dockerfile -t "${REGISTRY}/shoplite/web:${TAG}" .
          docker build -f services/catalog-api/Dockerfile -t "${REGISTRY}/shoplite/catalog-api:${TAG}" .
          docker build -f services/order-worker/Dockerfile -t "${REGISTRY}/shoplite/order-worker:${TAG}" .
          docker push "${REGISTRY}/shoplite/web:${TAG}"
          docker push "${REGISTRY}/shoplite/catalog-api:${TAG}"
          docker push "${REGISTRY}/shoplite/order-worker:${TAG}"
      - name: Update shoplite-gitops
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GITOPS_REPOSITORY: ${{ vars.GITOPS_REPOSITORY }}
          IMAGE_TAG: ${{ steps.names.outputs.tag }}
          registry: ${{ steps.names.outputs.registry }}
          image_style: ${{ steps.names.outputs.style }}
        run: |
          if [ -z "${GITOPS_TOKEN}" ] || [ -z "${GITOPS_REPOSITORY}" ]; then
            echo "GITOPS_TOKEN or GITOPS_REPOSITORY is unset. Images were published. Argo CD waits until envs/*/values.yaml changes."
            exit 0
          fi
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPOSITORY}.git" gitops
          python3 .github/scripts/bump-gitops-images.py gitops
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add envs/dev/values.yaml envs/prod/values.yaml
          if git diff --cached --quiet; then
            echo "GitOps values already match ${IMAGE_TAG}"
            exit 0
          fi
          git commit -m "Publish ShopLite images ${IMAGE_TAG}"
          git push
