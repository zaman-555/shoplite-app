apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "shoplite.fullname" . }}-strip-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "shoplite.fullname" . }}-web
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: web
    {{- include "shoplite.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{ if .Values.ingress.host }}host: {{ .Values.ingress.host | quote }}{{ end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "shoplite.fullname" . }}-web
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "shoplite.fullname" . }}-catalog-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: catalog-api
    {{- include "shoplite.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.namespace }}-{{ include "shoplite.fullname" . }}-strip-api@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{ if .Values.ingress.host }}host: {{ .Values.ingress.host | quote }}{{ end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "shoplite.fullname" . }}-catalog-api
                port:
                  number: 8000
