apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shoplite.fullname" . }}-redis
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: redis
    {{- include "shoplite.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "shoplite.selector" (dict "name" "redis" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        {{- include "shoplite.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.security.redisUser }}
        runAsGroup: {{ .Values.security.redisUser }}
        fsGroup: {{ .Values.security.redisUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.images.redis | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["redis-server", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.security.redisUser }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 20
          {{- include "shoplite.resources" .Values.redis.resources | nindent 10 }}
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shoplite.fullname" . }}-redis
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: redis
    {{- include "shoplite.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "shoplite.selector" (dict "name" "redis" "root" .) | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
