apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shoplite.fullname" . }}-web
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: web
    {{- include "shoplite.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "shoplite.selector" (dict "name" "web" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        {{- include "shoplite.labels" . | nindent 8 }}
    spec:
      {{- include "shoplite.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.security.webUser }}
        runAsGroup: {{ .Values.security.webUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ .Values.images.web | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "shoplite.fullname" . }}-config
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.security.webUser }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          {{- include "shoplite.resources" .Values.web.resources | nindent 10 }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "shoplite.fullname" . }}-web
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shoplite.fullname" . }}-web
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: web
    {{- include "shoplite.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "shoplite.selector" (dict "name" "web" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
