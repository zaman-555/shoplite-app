{{- $name := printf "%s-db" (include "shoplite.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Values.namespace $name }}
{{- $password := .Values.secrets.postgresPassword }}
{{- if not $password }}
{{- if and $existing $existing.data }}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDatabase | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s" .Values.secrets.postgresUser $password (include "shoplite.fullname" .) .Values.secrets.postgresDatabase | quote }}
