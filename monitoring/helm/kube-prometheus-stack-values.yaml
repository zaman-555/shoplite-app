prometheus:
  prometheusSpec:
    enableFeatures:
      - exemplar-storage
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 2d

alertmanager:
  config:
    route:
      receiver: shoplite
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
    receivers:
      - name: shoplite
        webhook_configs:
          - url: http://example.invalid/shoplite-alerts
            send_resolved: true

grafana:
  adminUser: admin
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
    datasources:
      defaultDatasourceEnabled: true
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          access: proxy
          isDefault: true
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          jsonData:
            exemplarTraceIdDestinations:
              - name: trace_id
                datasourceUid: tempo
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
          jsonData:
            derivedFields:
              - name: trace_id
                matcherRegex: '"trace_id":"([0-9a-f]{32})"'
                datasourceUid: tempo
                url: "$${__value.raw}"
                urlDisplayLabel: View trace
        - name: Tempo
          type: tempo
          uid: tempo
          access: proxy
          url: http://tempo.monitoring.svc.cluster.local:3200
          jsonData:
            tracesToLogsV2:
              datasourceUid: loki
              filterByTraceID: true
            lokiSearch:
              datasourceUid: loki
            serviceMap:
              datasourceUid: prometheus
            nodeGraph:
              enabled: true
